<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login section -->
<div id="login-section" class="card">
    <h2>Welcome to Finance Tracker</h2>
    <p>Enter your name to access your account:</p>
    <input type="text" id="username-input" placeholder="e.g. Zanele">
    <br>
    <button onclick="login()">Log In / Register</button>
</div>
<!-- Main App Section -->
<div id="app-section">
    <div class="card">
        <h2>Hello, <span id="display-user"></span>!</h2>
        <p>Current Balance:</p>
        <div id="balance">R0.00</div>

    </div>

</body>
</html>
