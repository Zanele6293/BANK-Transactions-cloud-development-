<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login section -->
<div id="login-section" class="card">
    <h2>Welcome to Finance Tracker</h2>
    <p>Enter your name to access your account:</p>
    <input type="text" id="username-input" placeholder="e.g. Zanele">
    <br>
    <button onclick="login()">Log In / Register</button>
</div>
<!-- Main App Section -->
<div id="app-section">
    <div class="card">
        <h2>Hello, <span id="display-user"></span>!</h2>
        <p>Current Balance:</p>
        <div id="balance">R0.00</div>

        <input type="number" id="amount" placeholder="Enter amount (R)">
        <br>
        <button class="deposit" onclick="performAction('income')">Deposit</button>
        <button class="withdraw" onclick="performAction('expense')">Withdraw</button>

        <p id="message"></p>
        <button class="logout" onclick="logout()">Log Out</button>
    </div>
    <!-- Transection History -->
    <div class="card">
        <h3>Transaction History</h3>
        <button onclick="fetchHistory()">Refresh History</button>

    </div>
</div>
</body>
</html>
