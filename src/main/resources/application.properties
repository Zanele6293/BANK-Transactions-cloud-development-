# Local H2 Fallback (Used when no environment variables are present)
spring.datasource.url=${DB_URL:jdbc:h2:mem:financedb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
# AWS S3 Object Storage Configuration
aws.s3.bucket-name=zionex-finance-profiles-477010600800
aws.region=us-east-1