# Added ;DB_CLOSE_DELAY=-1 to keep data in memory while the app is running
spring.datasource.url=${DB_URL:jdbc:h2:mem:zionexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console - Only enable this for development!
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Hibernate DDL - Change to 'validate' for Production to prevent accidental schema changes
spring.jpa.hibernate.ddl-auto=${DB_DDL:update}

# Use variables so you can switch buckets for Dev/Staging/Prod
aws.s3.bucket-name=${BUCKET_NAME:zionex-finance-profiles-477010600800}
aws.region=${AWS_REGION:us-east-1}


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging - Essential for Cloud debugging
logging.level.root=INFO
logging.level.za.co.zionex.banking=DEBUG